name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定镜像标签'
        required: false
        default: 'manual'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 创建 GitHub Release 需要写权限
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 拉取完整历史与 tag，供生成更新日志使用

      - name: Replace version placeholder
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          echo "Replacing version placeholder with: $VERSION"
          find web -name "*.html" -exec sed -i "s/>DEV</>$VERSION</g" {} \;
          find web -name "*.js" -exec sed -i "s/>DEV</>$VERSION</g" {} \;

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 预发布版本（带 -beta/-rc/-debug 等后缀）：
          #   - {{version}} 仍生成完整 tag（如 1.6.4-beta），可正常拉取调试
          #   - {{major}}.{{minor}} 和 {{major}} 自动跳过（metadata-action 对预发布版本默认不生成）
          #   - latest 不启用（见下方 enable 条件），不污染线上
          # 正式版本（如 v1.6.4，不带后缀）：正常更新 latest 及 major.minor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # ============================================================
      # 仅在 push tag(v*)时生成更新日志并创建 GitHub Release。
      # - 正式版(tag 不含 "-")：对比上一个正式版 tag，完整覆盖 beta 期间所有改动；标记为正式 release。
      # - 预发布版(tag 含 "-"，如 v1.6.4-beta.4)：对比上一个任意 tag，看增量；标记为 prerelease。
      # 更新日志按 Conventional Commits 前缀(feat/fix/perf/refactor 等)自动分组。
      # ============================================================
      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          CUR_TAG=${GITHUB_REF#refs/tags/}
          echo "当前 tag: $CUR_TAG"

          # 选取对比基准 tag(PREV_TAG)
          if [[ "$CUR_TAG" == *-* ]]; then
            IS_PRERELEASE=true
            # 预发布版：上一个任意 tag(排除自己)
            PREV_TAG=$(git describe --tags --abbrev=0 "$CUR_TAG^" 2>/dev/null || echo "")
          else
            IS_PRERELEASE=false
            # 正式版：上一个正式版 tag(排除所有带 - 的预发布)
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' "$CUR_TAG^" 2>/dev/null || echo "")
          fi
          echo "对比基准 tag: ${PREV_TAG:-(无,取全部历史)}"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          # 提交范围
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="$PREV_TAG..$CUR_TAG"
          else
            RANGE="$CUR_TAG"
          fi

          # 收集各分组(只取 commit 标题首行)。%s=subject
          FEAT=$(git log "$RANGE" --no-merges --pretty=format:'%s' | grep -E '^feat(\(.+\))?!?:' || true)
          FIX=$(git log "$RANGE" --no-merges --pretty=format:'%s' | grep -E '^fix(\(.+\))?!?:' || true)
          PERF=$(git log "$RANGE" --no-merges --pretty=format:'%s' | grep -E '^perf(\(.+\))?!?:' || true)
          REFACTOR=$(git log "$RANGE" --no-merges --pretty=format:'%s' | grep -E '^refactor(\(.+\))?!?:' || true)
          OTHER=$(git log "$RANGE" --no-merges --pretty=format:'%s' | grep -vE '^(feat|fix|perf|refactor|docs|test|chore|style|ci|build)(\(.+\))?!?:' || true)

          # 去掉前缀、转成 markdown 列表项的辅助函数
          fmt() {
            sed -E 's/^[a-z]+(\([^)]*\))?!?:[[:space:]]*//' | sed 's/^/- /'
          }

          {
            echo "## 🐳 Docker 镜像"
            echo ""
            echo '```'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${CUR_TAG#v}"
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              echo "docker pull ${REGISTRY}/${IMAGE_NAME}:latest"
            fi
            echo '```'
            echo ""
            echo "## 📝 更新内容"
            echo ""
            [[ -n "$FEAT" ]]     && { echo "### ✨ 新功能";   echo ""; echo "$FEAT"     | fmt; echo ""; }
            [[ -n "$FIX" ]]      && { echo "### 🐛 修复";     echo ""; echo "$FIX"      | fmt; echo ""; }
            [[ -n "$PERF" ]]     && { echo "### ⚡ 性能";     echo ""; echo "$PERF"     | fmt; echo ""; }
            [[ -n "$REFACTOR" ]] && { echo "### ♻️ 重构";     echo ""; echo "$REFACTOR" | fmt; echo ""; }
            [[ -n "$OTHER" ]]    && { echo "### 🔧 其他";     echo ""; echo "$OTHER"    | fmt; echo ""; }
            if [[ -n "$PREV_TAG" ]]; then
              echo "**完整变更**: https://github.com/${IMAGE_NAME}/compare/${PREV_TAG}...${CUR_TAG}"
            fi
          } > release_notes.md

          echo "===== 生成的更新日志 ====="
          cat release_notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUR_TAG=${GITHUB_REF#refs/tags/}
          PRERELEASE_FLAG=""
          if [[ "${{ steps.changelog.outputs.is_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$CUR_TAG" \
            --title "$CUR_TAG" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG