<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>
    /* 前端鉴权守卫：服务端 Cookie 鉴权的兜底，未登录时立即跳转，避免 HTML 内容闪现 */
    (function(){
      var html = document.documentElement;
      html.style.visibility = 'hidden';
      try {
        var t = localStorage.getItem('ccload_token');
        var e = localStorage.getItem('ccload_token_expiry');
        var valid = t && (!e || Date.now() <= parseInt(e, 10));
        if (!valid) {
          var ret = encodeURIComponent(location.pathname + location.search);
          location.replace('/web/login.html?returnUrl=' + ret);
          return;
        }
        html.style.visibility = '';
      } catch (_) {
        location.replace('/web/login.html');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title>系统设置 - AI Proxy</title>
  <link rel="stylesheet" href="/web/assets/css/theme.css">
  <link rel="stylesheet" href="/web/assets/css/styles.css">
  <link rel="stylesheet" href="/web/assets/css/layout.css">
  <link rel="stylesheet" href="/web/assets/css/tokens.css">
  <script src="/web/assets/js/theme.js"></script>
  <link href="/web/assets/css/inter.css" rel="stylesheet">
  <style>
    .field-tip {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-left: 4px;
      cursor: help;
    }
    .field-tip svg { color: var(--neutral-400); transition: color .15s; }
    .field-tip:hover svg { color: var(--primary-500); }
    .field-tip .tip-text {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--neutral-800);
      color: #fff;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.4;
      padding: 6px 10px;
      border-radius: 6px;
      width: max-content;
      max-width: 280px;
      z-index: 100;
      pointer-events: none;
      transition: opacity .15s, visibility .15s;
    }
    .field-tip:hover .tip-text { visibility: visible; opacity: 1; }
  </style>
</head>
<body class="dashboard-theme">

  <div class="app-container">
    <main class="main-content">
      <div class="content-area">
        <header class="mb-6">
          <div class="hero-header animate-slide-up">
            <div class="hero-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </div>
            <div>
              <h1 class="hero-title">系统设置</h1>
              <p class="hero-subtitle">配置运行时参数 · 模型计费管理</p>
            </div>

            <!-- Tab 按钮组 -->
            <div class="dash-actions" style="margin-left: auto;">
              <button class="dash-btn tab-btn active" data-tab="basic">基础设置</button>
              <button class="dash-btn tab-btn" data-tab="pricing">模型计费</button>
            </div>
          </div>
        </header>

        <!-- Tab: 基础设置 -->
        <section class="tab-content active" id="tab-basic" style="display: block;">
          <div class="glass-card mb-6 animate-slide-up">
            <div class="table-container">
              <table class="modern-table">
                <thead>
                  <tr>
                    <th style="width: 60%;">配置项</th>
                    <th style="width: 30%; text-align: right;">当前值</th>
                    <th style="width: 10%;">操作</th>
                  </tr>
                </thead>
                <tbody id="settings-tbody">
                  <!-- 动态填充 -->
                </tbody>
              </table>
            </div>
            <div style="display: flex; justify-content: flex-end; padding: 16px 0 0 0;">
              <button id="save-all-btn" onclick="saveAllSettings()" class="btn btn-primary" style="min-width: 120px;">
                保存所有更改
              </button>
            </div>
          </div>
        </section>

        <!-- Tab: 模型计费 -->
        <section class="tab-content" id="tab-pricing">
          <div class="glass-card mb-6 animate-slide-up">
            <!-- 工具栏 -->
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;">
              <input type="text" id="pricing-search" class="form-input" placeholder="搜索模型名称..."
                style="flex: 1; min-width: 200px; max-width: 300px; padding: 6px 12px; font-size: 13px;">
              <select id="pricing-type-filter" class="form-input" style="width: 140px; padding: 6px 10px; font-size: 13px;">
                <option value="">全部类型</option>
                <option value="anthropic">Claude</option>
                <option value="openai">OpenAI</option>
                <option value="gemini">Gemini</option>
              </select>
              <div style="margin-left: auto; display: flex; gap: 8px;">
                <button class="btn btn-secondary" onclick="importDefaultPricing()" title="从内置定价导入">
                  导入默认定价
                </button>
                <button class="btn btn-primary" onclick="openPricingDrawer()">
                  + 新增模型
                </button>
              </div>
            </div>

            <!-- 定价表格 -->
            <div class="table-container">
              <table class="modern-table">
                <thead>
                  <tr>
                    <th>模型</th>
                    <th>类型</th>
                    <th style="text-align: right;">输入价格 <span class="field-tip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">$/1M tokens</span></span></th>
                    <th style="text-align: right;">输出价格 <span class="field-tip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">$/1M tokens</span></span></th>
                    <th style="text-align: right;">高价输入 <span class="field-tip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">长上下文(>200K)输入价</span></span></th>
                    <th style="text-align: right;">高价输出 <span class="field-tip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">长上下文(>200K)输出价</span></span></th>
                    <th>别名 <span class="field-tip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">模型名变体，自动匹配到同一定价</span></span></th>
                    <th style="width: 80px;">操作</th>
                  </tr>
                </thead>
                <tbody id="pricing-tbody">
                  <!-- 动态填充 -->
                </tbody>
              </table>
            </div>
            <div id="pricing-empty" style="display: none; text-align: center; padding: 40px; color: var(--neutral-500);">
              暂无定价数据，点击"导入默认定价"快速初始化
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- 设置行模板 -->
  <template id="tpl-setting-row">
    <tr data-key="{{key}}">
      <td>{{description}}</td>
      <td style="text-align: right;">{{{inputHtml}}}</td>
      <td>
        <button class="btn-icon setting-reset-btn" data-key="{{key}}" title="重置为默认值">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </td>
    </tr>
  </template>

  <!-- 定价行模板 -->
  <template id="tpl-pricing-row">
    <tr data-id="{{id}}">
      <td>
        <div style="font-weight: 500; display: flex; align-items: center; gap: 6px;">{{model}}{{{predefined_badge}}}</div>
        <div style="font-size: 11px; color: var(--neutral-500);">{{display_name}}</div>
      </td>
      <td><span style="font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--neutral-100); color: var(--neutral-700);">{{channel_type_label}}</span></td>
      <td style="text-align: right; font-family: monospace;">${{input_price}}</td>
      <td style="text-align: right; font-family: monospace;">${{output_price}}</td>
      <td style="text-align: right; font-family: monospace;">{{{high_input_display}}}</td>
      <td style="text-align: right; font-family: monospace;">{{{high_output_display}}}</td>
      <td style="max-width: 200px;">
        <div style="font-size: 11px; color: var(--neutral-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="{{aliases_full}}">{{{aliases_display}}}</div>
      </td>
      <td>
        <div style="display: flex; gap: 4px;">
          <button class="btn-icon pricing-edit-btn" data-id="{{id}}" title="编辑">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="btn-icon pricing-delete-btn" data-id="{{id}}" data-model="{{model}}" title="删除" style="color: var(--danger-500);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      </td>
    </tr>
  </template>

  <!-- 定价编辑抽屉 -->
  <div id="pricingDrawerOverlay" class="drawer-overlay" onclick="closePricingDrawer()"></div>
  <div id="pricingDrawer" class="drawer">
    <div class="drawer-header">
      <h3 id="pricingDrawerTitle" class="drawer-title">新增模型定价</h3>
      <button class="drawer-close" onclick="closePricingDrawer()">&times;</button>
    </div>
    <div class="drawer-body">
      <form id="pricingDrawerForm" onsubmit="return false;">
        <input type="hidden" id="pricingDrawerId">

        <div class="form-group">
          <label class="form-label">模型名称 <span style="color: var(--danger-500);">*</span>
            <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">定价的唯一标识符，通常是不带日期后缀的基础模型名，如 claude-sonnet-4-5。创建后不可修改。</span></span>
          </label>
          <input type="text" id="pricingModel" class="form-input" placeholder="例如: claude-sonnet-4-5" required>
        </div>

        <div class="form-group">
          <label class="form-label">显示名称
            <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">用于前端展示的友好名称（可选）。留空时显示模型名称本身。</span></span>
          </label>
          <input type="text" id="pricingDisplayName" class="form-input" placeholder="前端显示名（可选）">
        </div>

        <div class="form-group">
          <label class="form-label">渠道类型 <span style="color: var(--danger-500);">*</span>
            <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">此模型所属的 API 提供商类型，决定了计费计算逻辑和预定义列表分类。</span></span>
          </label>
          <select id="pricingChannelType" class="form-input" required>
            <option value="anthropic">Claude (anthropic)</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">输入价格 ($/1M) <span style="color: var(--danger-500);">*</span>
              <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">每 100 万输入 token 的美元价格。用于计算请求成本。</span></span>
            </label>
            <input type="number" id="pricingInputPrice" class="form-input" step="0.001" min="0" required>
          </div>
          <div class="form-group">
            <label class="form-label">输出价格 ($/1M) <span style="color: var(--danger-500);">*</span>
              <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">每 100 万输出 token 的美元价格。用于计算响应成本。</span></span>
            </label>
            <input type="number" id="pricingOutputPrice" class="form-input" step="0.001" min="0" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">高价输入 ($/1M)
              <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">长上下文场景（如 Gemini >200K token）的输入价格。设为 0 表示不启用分段定价。</span></span>
            </label>
            <input type="number" id="pricingInputPriceHigh" class="form-input" step="0.001" min="0" value="0">
          </div>
          <div class="form-group">
            <label class="form-label">高价输出 ($/1M)
              <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">长上下文场景的输出价格。与高价输入配合使用。</span></span>
            </label>
            <input type="number" id="pricingOutputPriceHigh" class="form-input" step="0.001" min="0" value="0">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">缓存读取倍率
              <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">缓存读取 token 的价格 = 输入价格 × 此倍率。例如 0.1 表示缓存读取只收输入价的 10%。设为 0 使用系统默认值。</span></span>
            </label>
            <input type="number" id="pricingCacheReadMul" class="form-input" step="0.01" min="0" value="0">
          </div>
          <div class="form-group">
            <label class="form-label">缓存写入倍率
              <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">缓存写入 token 的价格 = 输入价格 × 此倍率。例如 1.25 表示缓存写入收输入价的 125%。设为 0 使用系统默认值。</span></span>
            </label>
            <input type="number" id="pricingCacheWriteMul" class="form-input" step="0.01" min="0" value="0">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">别名
            <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">带日期后缀或其他变体名（如 claude-sonnet-4-5-20250929），请求这些名称时会自动匹配到此模型的定价。每行一个。</span></span>
          </label>
          <textarea id="pricingAliases" class="form-input" rows="3" placeholder="每行一个别名，例如：&#10;claude-sonnet-4-5-20250929&#10;claude-sonnet-4-5-latest" style="font-size: 12px; font-family: monospace;"></textarea>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; background: var(--neutral-50);">
          <input type="checkbox" id="pricingIsPredefined" style="width: 16px; height: 16px; cursor: pointer;">
          <label for="pricingIsPredefined" style="cursor: pointer; font-size: 13px; font-weight: 500; margin: 0;">
            加入预定义模型列表
          </label>
          <span class="field-tip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="tip-text">勾选后，此模型会出现在渠道页面的"导入默认"模型列表中，方便快速添加到渠道支持的模型。</span></span>
        </div>
      </form>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-secondary" onclick="closePricingDrawer()">取消</button>
      <button class="btn btn-primary" onclick="savePricingEntry()" id="pricingSaveBtn">保存</button>
    </div>
  </div>

  <script src="/web/assets/js/template-engine.js"></script>
  <script src="/web/assets/js/ui.js"></script>
  <script src="/web/assets/js/settings.js"></script>
</body>
</html>
